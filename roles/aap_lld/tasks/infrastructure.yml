---
# Infrastructure & platform LLD. Pure ansible.builtin + a tiny custom filter
# (gruve_pick) shipped with the role — no json_query / community.general, so it
# runs in the default execution environment.

- name: Get platform ping (version, HA)
  ansible.builtin.uri:
    url: "{{ aap_hostname }}{{ aap_prefix.controller }}/ping/"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_token }}"
      Accept: "application/json"
    validate_certs: "{{ aap_validate_certs }}"
    return_content: true
  register: _ping
  no_log: true
  failed_when: false

- name: Store ping
  ansible.builtin.set_fact:
    lld_ping: "{{ _ping.json | default({}) }}"

- name: Collect instances
  ansible.builtin.include_tasks: _fetch.yml
  vars:
    fetch_url: "{{ aap_prefix.controller }}/instances/"
    fetch_fact: lld_instances

- name: Collect hosts"
  ansible.builtin.include_tasks: _fetch.yml
  vars: 
    fetch_url: "{{ aap_prefix.controller }}/hosts/"
    fetch_fact: lld_hosts

- name: Collect hosts metrics"
  ansible.builtin.include_tasks: _fetch.yml
  vars: 
    fetch_url: "{{ aap_prefix.controller }}/host_metrics/"
    fetch_fact: lld_host_metrics

- name: Collect instance groups
  ansible.builtin.include_tasks: _fetch.yml
  vars:
    fetch_url: "{{ aap_prefix.controller }}/instance_groups/"
    fetch_fact: lld_instance_groups

- name: Collect execution environments
  ansible.builtin.include_tasks: _fetch.yml
  vars:
    fetch_url: "{{ aap_prefix.controller }}/execution_environments/"
    fetch_fact: lld_execution_environments

- name: Distil infrastructure LLD
  ansible.builtin.set_fact:
    lld_infrastructure:
      version: "{{ lld_ping.version | default('unknown') }}"
      ha: "{{ lld_ping.ha | default(false) }}"
      instance_count: "{{ lld_instances | length }}"
      instances: "{{ lld_instances | map('gruve_pick', ['hostname','node_type','node_state','enabled','capacity','cpu','memory','ip_address']) | list }}"
      node_types: "{{ lld_instances | map(attribute='node_type', default='unknown') | list }}"
      host_count: "{{ lld_hosts | length }}"
      hosts: "{{ lld_hosts | map('gruve_pick', ['id','name','description','inventory','enabled','instance_id']) | list }}"
      instance_groups: "{{ lld_instance_groups | map('gruve_pick', ['name','is_container_group','policy_instance_minimum','policy_instance_percentage','max_concurrent_jobs','max_forks']) | list }}"
      execution_environments: "{{ lld_execution_environments | map('gruve_pick', ['name','image','pull']) | list }}"
      has_mesh: "{{ (lld_instances | selectattr('node_type','defined') | selectattr('node_type','in',['execution','hop']) | list | length) > 0 }}"
